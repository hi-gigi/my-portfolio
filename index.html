<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jiaqi Zhuo — Design Portfolio</title>
    <meta name="description" content="Design portfolio of Jiaqi Zhuo." />

    <!-- Fonts: Raleway (headings), Inter (body), IBM Plex Mono (labels).
         Weights loaded = weights actually used: Raleway 500/600/700,
         Inter 400/500/600, Mono 400. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload the hero headline face (Raleway 600, latin subset) so the
         LCP text paints without a swap. If Google revises the font this
         hashed URL 404s and the browser just loads it normally via the
         stylesheet below — re-copy it from the css2 response if that happens. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/raleway/v37/1Ptxg8zYS_SKggPN4iEgvnHyvveLxVsEpbCIPrEVIT9d0c8.woff2"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap"
    />

    <!-- Set the colour theme before first paint, so there is no flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "dark" || saved === "light") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Undo the 404.html redirect (see public/404.html) before React
         Router mounts, restoring the real deep-linked path via
         history.replaceState. No-op on a normal navigation.
         The query is "?p=<path>" (+ "&q=<original query>" if there was
         one) — pull the value out from behind each "p="/"q=" label,
         don't just re-glue the raw params with "?". -->
    <script>
      (function (l) {
        if (l.search[1] === "p" && l.search[1] !== undefined) {
          var params = l.search.slice(1).split("&");
          var path = params[0].slice(2).replace(/~and~/g, "&");
          var query = params[1]
            ? "?" + params[1].slice(2).replace(/~and~/g, "&")
            : "";
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + path + query + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
